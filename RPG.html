<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пепел и Сталь — RPG</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,600;0,700;1,600;1,700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0d0a07; --panel:#1a130c; --panel2:#211810; --line:#3a2c1a; --line2:#5a4526;
  --gold:#d3a44c; --gold2:#f0cf8a; --ember:#e0653a; --teal:#4fb3a5; --blood:#c04040; --mana:#5a9fd6;
  --txt:#e9dcc3; --dim:#a08e6f; --dim2:#6f6250;
  --r0:#b9b3a4; --r1:#6fa8dc; --r2:#ffd24a; --r3:#e0575f; --r4:#ff9d3b;
  --fd:'Cormorant',Georgia,serif; --fb:'PT Sans','Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg0);color:var(--txt);font-family:var(--fb);font-size:15px;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1200px 700px at 70% -10%,#2a1a0c66,transparent 60%),
             radial-gradient(900px 600px at 10% 110%,#1c120866,transparent 60%),
             radial-gradient(ellipse at 50% 50%,transparent 55%,#000000b8 100%);}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none}
#app{position:relative;z-index:2;display:none;height:100vh;overflow:hidden;
  grid-template-columns:216px 1fr 340px;grid-template-rows:70px 1fr;
  grid-template-areas:"top top top" "nav main log";}
#topbar{grid-area:top;display:flex;align-items:center;gap:18px;padding:0 18px;background:linear-gradient(#1c140c,#140e08);border-bottom:1px solid var(--line);box-shadow:0 4px 18px #0009;min-width:0}
#nav{grid-area:nav;background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;min-height:0;min-width:0}
#main{grid-area:main;overflow-y:auto;padding:20px 24px;position:relative;min-height:0;min-width:0}
#logpane{grid-area:log;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.crest{font-family:var(--fd);font-weight:700;font-size:22px;color:var(--gold);letter-spacing:.06em;text-shadow:0 0 18px #d3a44c55;white-space:nowrap}
.crest small{color:var(--dim);font-size:13px;font-family:var(--fb);letter-spacing:.2em;display:block;margin-top:-4px}
.tb-name{min-width:150px}
.tb-name b{font-family:var(--fd);font-size:19px}
.tb-name span{display:block;color:var(--dim);font-size:12px}
.tb-bars{flex:1;display:flex;flex-direction:column;gap:5px;max-width:520px}
.bar{position:relative;height:15px;background:#00000090;border:1px solid #000;box-shadow:inset 0 2px 5px #000c;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;transition:width .25s ease}
.bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;letter-spacing:.04em}
.bar.hp>i{background:linear-gradient(#e0605a,#8c2020)}
.bar.mp>i{background:linear-gradient(#6aa8e8,#2c5c9c)}
.bar.xp>i{background:repeating-linear-gradient(45deg,var(--gold),var(--gold) 8px,#b98c34 8px,#b98c34 16px)}
.bar.ord>i{background:linear-gradient(#8fb36f,#4f7a3a)}
.bar.hp{height:17px}.bar.mp{height:13px}.bar.xp{height:9px}
.res{display:flex;gap:14px;font-weight:700;align-items:center}
.res span{font-size:14px}
.res .g{color:var(--gold2)}.res .f{color:var(--teal)}
.res .lv{background:#00000060;border:1px solid var(--line2);padding:3px 10px;color:var(--gold);font-family:var(--fd);font-size:17px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--dim);font-family:var(--fb);font-size:14px;font-weight:700;letter-spacing:.05em;padding:10px 12px;cursor:pointer;transition:.18s;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.navbtn i{font-style:normal;width:22px;text-align:center;font-size:16px}
.navbtn:hover{color:var(--gold2);background:#ffffff08;transform:translateX(3px)}
.navbtn.on{color:var(--gold2);background:linear-gradient(90deg,#d3a44c22,transparent);border-color:var(--line2);box-shadow:inset 3px 0 0 var(--gold)}
.navbtn .bdg{margin-left:auto;background:var(--ember);color:#fff;font-size:10px;padding:1px 6px}
.nav-sep{height:1px;background:var(--line);margin:8px 4px}
.panel{background:var(--panel);border:1px solid var(--line);padding:16px 18px;margin-bottom:16px;position:relative;box-shadow:0 6px 20px #0006}
.panel::before{content:"";position:absolute;inset:3px;border:1px solid #ffffff08;pointer-events:none}
h2.pt{font-family:var(--fd);font-size:28px;font-weight:700;color:var(--gold2);letter-spacing:.04em;margin-bottom:2px}
h2.pt::after{content:"";display:block;width:70px;height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:14px;font-style:italic}
.btn{font-family:var(--fb);font-weight:700;font-size:14px;letter-spacing:.05em;color:var(--txt);background:linear-gradient(#2b2013,#1a130a);border:1px solid var(--line2);padding:9px 18px;cursor:pointer;transition:.15s;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn:hover{color:var(--gold2);border-color:var(--gold);box-shadow:0 0 14px #d3a44c33,inset 0 0 10px #d3a44c14;transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.danger{border-color:#6c2a2a;color:#e8a0a0}.btn.danger:hover{border-color:var(--blood);box-shadow:0 0 14px #c0404033}
.btn.big{font-size:16px;padding:13px 30px}
.btn.gold{background:linear-gradient(#5a4218,#33250d);border-color:var(--gold);color:var(--gold2)}
.btn.small{padding:5px 10px;font-size:12px}
.btn.plus{padding:2px 10px;font-size:15px;line-height:1.3}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--panel2);border:1px solid var(--line);padding:14px;transition:.2s;position:relative}
.card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 8px 22px #0008}
.zonecard h3{font-family:var(--fd);font-size:21px;color:var(--txt)}
.zonecard .lv{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.1em}
.zonecard p{color:var(--dim);font-size:13px;margin:6px 0 10px;min-height:50px;font-style:italic}
.zonecard.locked{opacity:.45;filter:grayscale(.6)}
.boss-tag{color:var(--blood);font-size:12px;font-weight:700}
.lootinfo{font-size:11px;color:var(--dim2);margin-top:6px;line-height:1.5}
.order{display:flex;gap:12px;align-items:center;background:#00000030;border:1px solid var(--line);padding:10px 14px;margin-bottom:8px;transition:.15s}
.order.done{border-color:#5a7a3a;box-shadow:0 0 14px #7fb95c22}
.order .oi{font-size:24px}
.order h4{font-family:var(--fd);font-size:18px}
.order p{font-size:12.5px;color:var(--dim)}
.order .rw{font-size:12px;color:var(--gold2);margin-top:2px}
.item{display:flex;gap:10px;align-items:flex-start;background:#00000030;border:1px solid var(--line);border-left:3px solid var(--r0);padding:9px 12px;margin-bottom:8px;cursor:pointer;transition:.15s}
.item:hover{background:#ffffff07;transform:translateX(3px)}
.item.r1{border-left-color:var(--r1)}.item.r2{border-left-color:var(--r2)}.item.r3{border-left-color:var(--r3);box-shadow:0 0 12px #e0575f18}
.item.r4{border-left-color:var(--r4);box-shadow:0 0 16px #ff9d3b2c;animation:legend 2.4s infinite}
@keyframes legend{0%,100%{box-shadow:0 0 10px #ff9d3b22}50%{box-shadow:0 0 22px #ff9d3b55}}
.item .nm{font-weight:700}
.item .ds{font-size:12px;color:var(--dim)}
.item .af{font-size:12px;color:#9fb6d0;margin-top:2px}
.item .spl{font-size:12px;color:var(--gold2);margin-top:2px}
.item .eq{margin-left:auto;align-self:center;font-size:11px;color:var(--gold);border:1px solid var(--line2);padding:2px 7px;white-space:nowrap}
.c0{color:var(--r0)}.c1{color:var(--r1)}.c2{color:var(--r2)}.c3{color:var(--r3)}.c4{color:var(--r4)}
#logpane h3{font-family:var(--fd);font-size:20px;color:var(--gold);padding:12px 16px;border-bottom:1px solid var(--line);letter-spacing:.06em}
#logbox{flex:1;overflow-y:auto;padding:10px 14px}
.le{padding:6px 9px;margin-bottom:6px;font-size:13px;line-height:1.45;border-left:2px solid #ffffff14;background:#00000025;animation:lein .35s ease}
@keyframes lein{from{opacity:0;transform:translateY(7px)}to{opacity:1}}
.le.sys{border-color:var(--teal);color:#bfe0da}
.le.loot{border-color:var(--gold);color:#e5d3a8}
.le.bad{border-color:var(--blood);color:#e5aaaa}
.le.good{border-color:#7fb95c;color:#c8e5b4}
.le.story{border-color:#8a6ca8;color:#d8c8ea;font-style:italic}
#arena{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:16px}
.combatant{background:var(--panel2);border:1px solid var(--line);padding:18px;text-align:center;position:relative;overflow:hidden}
.combatant .face{font-size:58px;line-height:1;margin:8px 0;filter:drop-shadow(0 6px 12px #000)}
.combatant.enemy{border-color:#5c2a2a}
.combatant.enemy.boss{border-color:var(--blood);box-shadow:0 0 26px #c0404030,inset 0 0 40px #c0404012;animation:bosspulse 2.6s infinite}
@keyframes bosspulse{0%,100%{box-shadow:0 0 18px #c0404022}50%{box-shadow:0 0 34px #c0404055}}
.combatant h3{font-family:var(--fd);font-size:23px}
.combatant .tag{font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.chlabel{font-size:10px;color:var(--dim2);letter-spacing:.15em;margin-top:6px}
.float{position:absolute;left:50%;top:36%;font-family:var(--fd);font-weight:700;font-size:30px;color:#ff8d7a;pointer-events:none;animation:fl .9s forwards;text-shadow:0 2px 4px #000}
.float.crit{font-size:42px;color:var(--gold2)}
.float.heal{color:#8fe08f}
@keyframes fl{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-52px)}}
.shake{animation:shk .32s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(6px)}}
#cfeed{height:170px;overflow-y:auto;background:#00000040;border:1px solid var(--line);padding:10px 14px;margin-bottom:14px;font-size:13.5px}
#cfeed p{margin-bottom:5px;animation:lein .3s ease}
#cfeed .p{color:#e8d8b0}#cfeed .e{color:#e5a0a0}#cfeed .s{color:#9fd0c8;font-style:italic}#cfeed .c{color:var(--gold2);font-weight:700}
.skillbar{display:flex;flex-wrap:wrap;gap:8px}
.skillbar .btn small{display:block;font-weight:400;font-size:10.5px;color:var(--mana);letter-spacing:0}
#treewrap{position:relative;height:calc(100vh - 230px);min-height:460px;border:1px solid var(--line);background:radial-gradient(900px 600px at 50% 40%,#1e160d,#0c0906);overflow:hidden}
#treesvg{width:100%;height:100%;cursor:grab;touch-action:none}
#treesvg.grab{cursor:grabbing}
.nd{transition:.15s;cursor:pointer}
.nd:hover{filter:brightness(1.5)}
.nd.av circle.halo{animation:halo 1.8s infinite}
@keyframes halo{0%,100%{opacity:.15}50%{opacity:.6}}
#tt{position:absolute;z-index:5;background:#12100af2;border:1px solid var(--line2);padding:10px 13px;font-size:13px;max-width:280px;pointer-events:none;display:none;box-shadow:0 8px 24px #000c}
#tt b{font-family:var(--fd);font-size:17px;display:block;margin-bottom:3px}
#tt .m{color:#9fd0a8}#tt .st{color:var(--dim);font-size:11.5px;margin-top:5px}
.pips{display:flex;gap:6px;margin:10px 0}
.pip{width:16px;height:16px;border:1px solid var(--line2);transform:rotate(45deg);background:#00000060}
.pip.done{background:var(--gold);box-shadow:0 0 8px #d3a44c88}
.pip.cur{background:var(--ember);box-shadow:0 0 8px #e0653a88;animation:halo 1.4s infinite}
.statline{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #ffffff10;font-size:14px;gap:10px;align-items:center}
.statline b{color:var(--gold2)}
.statline .hint{font-size:11px;color:var(--dim2);display:block}
.mast{display:inline-block;background:#ff9d3b22;border:1px solid var(--r4);color:var(--r4);font-size:10px;padding:1px 6px;margin-left:6px;letter-spacing:.06em}
.gemchip{display:inline-flex;gap:4px;align-items:center;background:#00000050;border:1px solid var(--line2);padding:3px 9px;font-size:12px;cursor:pointer;margin:2px}
.gemchip:hover{border-color:var(--gold)}
select.gsel{background:#00000070;color:var(--txt);border:1px solid var(--line2);padding:3px 6px;font-size:12px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-70px);z-index:99;background:#1c140af5;border:1px solid var(--gold);color:var(--gold2);font-weight:700;padding:12px 26px;transition:.35s;opacity:0;box-shadow:0 10px 30px #000c;letter-spacing:.04em;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#err{display:none;position:fixed;bottom:10px;left:10px;z-index:200;background:#3a1010;border:1px solid var(--blood);color:#ffb0b0;font-size:12px;padding:8px 12px;max-width:70vw}
#create{position:relative;z-index:2;height:100vh;overflow-y:auto;padding:30px 20px;background:radial-gradient(1000px 500px at 50% -10%,#2a1a0c88,transparent 60%)}
#create .wrap{max-width:1060px;margin:0 auto}
.title-big{font-family:var(--fd);font-weight:700;font-size:clamp(44px,7vw,84px);text-align:center;color:var(--gold);letter-spacing:.12em;text-shadow:0 0 34px #d3a44c44,0 4px 0 #00000088;line-height:1}
.title-sub{text-align:center;color:var(--dim);letter-spacing:.44em;font-size:12px;margin:8px 0 34px;text-transform:uppercase}
.selgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:22px}
.selcard{background:var(--panel2);border:1px solid var(--line);padding:14px;cursor:pointer;transition:.18s}
.selcard:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 10px 24px #000a}
.selcard.on{border-color:var(--gold);box-shadow:0 0 20px #d3a44c33;background:#2a1f10}
.selcard h4{font-family:var(--fd);font-size:20px;color:var(--gold2)}
.selcard p{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.45}
.selcard .bn{margin-top:8px;font-size:12px;color:#9fd0a8}
#cname{background:#00000060;border:1px solid var(--line2);color:var(--gold2);font-family:var(--fd);font-size:22px;padding:8px 14px;width:320px;outline:none}
#cname:focus{border-color:var(--gold);box-shadow:0 0 14px #d3a44c33}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-track{background:#00000030}
::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid var(--bg0)}
@media(max-width:1100px){#app{grid-template-columns:64px 1fr;grid-template-areas:"top top" "nav main"}#logpane{display:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div id="create"><div class="wrap">
  <div class="title-big">ПЕПЕЛ И СТАЛЬ</div>
  <div class="title-sub">хроники выжженных земель</div>
  <div class="panel"><h2 class="pt">Рождение героя</h2><div class="sub">Пепел падает с небес уже сотый год. Пять твердынь ещё держатся — им нужен клинок. Выбери, кем ты был до войны.</div>
    <div style="font-weight:700;color:var(--gold);letter-spacing:.1em;margin-bottom:8px">РАСА</div>
    <div class="selgrid" id="racegrid"></div>
    <div style="font-weight:700;color:var(--gold);letter-spacing:.1em;margin-bottom:8px">КЛАСС</div>
    <div class="selgrid" id="classgrid"></div>
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:6px">
      <input id="cname" maxlength="16" placeholder="Имя героя…">
      <button class="btn big gold" onclick="startGame()">⚔ Вступить в Грейхолд</button>
    </div>
    <div id="csum" style="margin-top:14px;color:var(--dim);font-size:13px"></div>
  </div>
</div></div>

<div id="app">
  <header id="topbar">
    <div class="crest">ПЕПЕЛ И СТАЛЬ<small>ГРЕЙХОЛД</small></div>
    <div class="tb-name"><b id="t-name"></b><span id="t-race"></span></div>
    <span class="res"><span class="lv" id="t-lvl">1</span></span>
    <div class="tb-bars">
      <div class="bar hp"><i id="b-hp"></i><span id="t-hp"></span></div>
      <div class="bar mp"><i id="b-mp"></i><span id="t-mp"></span></div>
      <div class="bar xp"><i id="b-xp"></i><span id="t-xp" style="font-size:8px"></span></div>
    </div>
    <span class="res"><span class="g" id="t-gold">0 🪙</span><span class="f" id="t-frag">0 ◆</span></span>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
  <aside id="logpane"><h3>📜 Летопись</h3><div id="logbox"></div></aside>
</div>
<div class="toast" id="toast"></div>
<div id="err"></div>

<script>
/* ================= ЯДРО ================= */
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const P=a=>a[RI(0,a.length-1)];
const fmt=n=>{const v=Math.floor(Number(n));return isNaN(v)?'0':v.toLocaleString('ru-RU');};
let UID=0; const uid=()=>'x'+(++UID)+Math.random().toString(36).slice(2,5);
window.addEventListener('error',e=>{const el=$('err');if(el){el.style.display='block';el.textContent='Ошибка: '+(e.message||'неизвестная');}});
function showErr(msg){const el=$('err');if(el){el.style.display='block';el.textContent='Ошибка: '+msg;}}
const MODN={hp:'к макс. ОЗ',mp:'к макс. Маны',str:'Сила',dex:'Ловкость',int:'Интеллект',vit:'Выносливость',luk:'Удача',phys:'физ. урона',spell:'маг. урона',dmg:'любого урона',crit:'шанс крит.',critd:'крит. урон',armor:'брони',evade:'уклонение',leech:'кража жизни',gf:'к золоту',mf:'к шансу лута',xp:'к опыту',spd:'к скорости',resfire:'сопр. огню',respoison:'сопр. яду',resice:'сопр. льду',reslight:'сопр. молнии',resshadow:'сопр. тьме'};
const modStr=(k,v)=>{const pct=['hp','mp','phys','spell','dmg','crit','critd','armor','evade','leech','gf','mf','xp','spd','resfire','respoison','resice','reslight','resshadow'].includes(k);return (v>0?'+':'')+v+(pct?'%':'')+' '+(MODN[k]||k);};

/* ================= ДАННЫЕ ================= */
const RACES={
 human:{name:'Человек',icon:'🧑',desc:'Дети пепла, упрямые и живучие.',b:{str:1,dex:1,int:1,vit:1},mods:[{k:'xp',v:10}],trait:'+10% опыта, +1 ко всем хар-кам'},
 orc:{name:'Орк',icon:'👹',desc:'Чем ближе смерть — тем яростнее бьют.',b:{str:3,vit:2,dex:0,int:-1},mods:[],trait:'Ярость: +25% урона при ОЗ < 35%'},
 elf:{name:'Эльф',icon:'🧝',desc:'Бьют точно в щели брони.',b:{dex:3,int:2,str:0,vit:-1},mods:[{k:'crit',v:3}],trait:'+3% шанс критического удара'},
 dwarf:{name:'Дворф',icon:'⛏️',desc:'Сталь слушается их рук.',b:{str:2,vit:2,dex:0,int:0},mods:[],trait:'+15% к шансу успеха заточки'},
 undead:{name:'Нежить',icon:'💀',desc:'Чужая жизнь подпитывает их.',b:{int:3,dex:2,str:0,vit:-2},mods:[{k:'leech',v:5}],trait:'5% кражи жизни'}};
const CLASSES={

function buildClassTree(){
 if(!S)return;const cls=S.hero.cls,nodes=[],adj={},byId={};
 const mk=(id,x,y,si,kind)=>{const nd={id:id,x:x,y:y,si:si,kind:kind};nodes.push(nd);byId[id]=nd;adj[id]=[];return nd;};
 mk('origin',0,0,-1,'origin');
 CLASSES[cls].skills.forEach((key,si)=>{
  const a=(-90+si*60)*Math.PI/180;let prev='origin';
  [95,150,205,260,315].forEach((dist,ri)=>{
   const jit=(((si*3+ri*7)%9)-4)*Math.PI/180;
   const id='r_'+si+'_'+(ri+1);
   mk(id,Math.cos(a+jit)*dist,Math.sin(a+jit)*dist,si,'rank');
   adj[prev].push(id);adj[id].push(prev);prev=id;});
  const mid='m_'+si;
  mk(mid,Math.cos(a)*388,Math.sin(a)*388,si,'mastery');
  adj[prev].push(mid);adj[mid].push(prev);});
 CT={nodes:nodes,adj:adj,byId:byId};}
function talloc(){return S.hero.talloc;}
function canAllocCT(id){if(talloc()[id])return false;return CT.adj[id].some(a=>talloc()[a]);}
function skillRank(si){let r=0;for(let k=1;k<=5;k++){if(talloc()['r_'+si+'_'+k])r=k;else break;}return r;}
function skillRankByKey(key){const si=CLASSES[S.hero.cls].skills.indexOf(key);return si<0?0:skillRank(si);}
function hasMastery(si){return !!talloc()['m_'+si];}
function allocNode(id){if(!CT)return;const nd=CT.byId[id];if(!nd||!canAllocCT(id))return;
 if(S.hero.pts<1){toast('Недостаточно очков навыков');return;}
 S.hero.pts--;talloc()[id]=true;
 const key=CLASSES[S.hero.cls].skills[nd.si];
 toast((nd.kind==='mastery'?'🌟 Мастерство: ':'📖 Изучено: ')+SKILLDB[key].n);
 log(nd.kind==='mastery'?'🌟 Мастерство освоено: <b>'+SKILLDB[key].n+'</b>':'📖 Изучено: <b>'+SKILLDB[key].n+'</b>, ранг '+skillRank(nd.si),'good');
 save();renderTree();renderTop();}
function spentPts(){return Math.max(0,Object.keys(talloc()).length-2);}
function refundTree(){const spent=spentPts();if(spent===0){toast('Нечего забывать');return;}
 const cost=spent*30;if(S.gold<cost){toast('Нужно '+fmt(cost)+' 🪙');return;}
 S.gold-=cost;S.hero.pts+=spent;S.hero.talloc={origin:true,r_0_1:true};S.cs=null;
 log('🌀 Ты забываешь выученное. Возвращено очков: '+spent,'sys');save();renderTree();renderTop();}
function skillEffTxt(key,rank){const sk=SKILLDB[key];const rMul=1+0.15*Math.max(0,rank-1);const parts=[];
 if(sk.mult){const mult=sk.mult*rMul;parts.push('урон ×'+mult.toFixed(2)+(sk.hits?' ×'+sk.hits:'')+(sk.mag?' (магия)':''));
  if(S&&S.cs){const est=sk.mag?Math.round(S.cs.spellPow*mult):Math.round((S.cs.dmgMin+S.cs.dmgMax)/2*mult);
   parts.push('≈ '+fmt(est)+' за попадание');}}
 if(sk.healPct)parts.push('лечит '+Math.round(sk.healPct*(1+0.12*Math.max(0,rank-1)))+'% ОЗ');
 if(sk.buff)parts.push(sk.buff.map(b=>'+'+Math.round(b.pct*rMul)+'% '+(BUFFN[b.k]||b.k)+' ('+b.t+' с)').join(', '));
 if(sk.dot)parts.push('эффект '+sk.dot.pct+'% × '+sk.dot.t+' с');
 if(sk.selfcost)parts.push('цена: '+sk.selfcost+'% ОЗ');
 if(sk.exec)parts.push('казнь: порог '+sk.exec+'% ОЗ');
 if(sk.combo)parts.push('комбо по отравленным');
 if(sk.debuff)parts.push('метка: +'+sk.debuff.pct+'% урона по врагу');
 parts.push('мана: '+sk.mp);
 return parts.join(' · ');}

/* ================= ПЕРСОНАЖ ================= */
function calcStats(){
 if(!S)return null;const h=S.hero;
 const st={str:5,dex:5,int:5,vit:5,luk:3};const mods=[];const race=RACES[h.race];
 Object.keys(race.b).forEach(k=>st[k]+=race.b[k]);
 Object.keys(h.bonus||{}).forEach(k=>st[k]+=(h.bonus[k]||0));
 (race.mods||[]).forEach(m=>mods.push(m));
 Object.keys(GROW[h.cls]).forEach(k=>st[k]+=Math.floor(h.lvl*GROW[h.cls][k]));
 const eqSum=k=>Object.values(h.eq).filter(Boolean).reduce((s,it)=>s+((it.mods&&it.mods[k])||0),0);
 ['str','dex','int','vit','luk'].forEach(k=>st[k]+=eqSum(k));
 const agg={};mods.forEach(m=>agg[m.k]=(agg[m.k]||0)+m.v);
 Object.values(h.eq).filter(Boolean).forEach(it=>Object.keys(it.mods||{}).forEach(k=>agg[k]=(agg[k]||0)+it.mods[k]));
 if(S.buff)Object.keys(S.buff.mods).forEach(k=>agg[k]=(agg[k]||0)+S.buff.mods[k]);
 // самоцветы
 const res={fire:0,poison:0,ice:0,light:0,shadow:0};
 const wg={fire:0,poison:0,ice:0,light:0,burnCh:0,poisonCh:0,slow:false,critB:0,leechB:0,dmgB:0};
 const gemMap={ruby:'fire',emerald:'poison',sapphire:'ice',topaz:'light',onyx:'shadow'};
 Object.values(h.eq).filter(Boolean).forEach(it=>{(it.gems||[]).forEach(g=>{if(!g)return;
  if(it.slot==='weapon'){
   if(g==='ruby'){wg.fire+=20;wg.burnCh=20;}
   else if(g==='emerald'){wg.poison+=20;wg.poisonCh=25;}
   else if(g==='sapphire'){wg.ice+=20;wg.slow=true;}
   else if(g==='topaz'){wg.light+=15;wg.critB+=5;}
   else if(g==='onyx'){wg.leechB+=6;}
   else if(g==='diamond'){wg.dmgB+=10;}}
  else{
   if(g==='diamond'){Object.keys(res).forEach(k=>res[k]+=8);}
   else if(gemMap[g])res[gemMap[g]]+=12;}});});
 Object.keys(res).forEach(k=>{res[k]=Math.min(60,res[k]+(agg['res'+k]||0));});
 const lvl=h.lvl,o={};
 o.str=st.str;o.dex=st.dex;o.int=st.int;o.vit=st.vit;o.luk=st.luk;
 o.hpPct=agg.hp||0;o.mpAdd=agg.mp||0;o.phys=agg.phys||0;o.spell=agg.spell||0;
 o.dmgAll=(agg.dmg||0)+wg.dmgB;
 o.crit=Math.max(0,5+st.dex*0.35+(agg.crit||0)+wg.critB);o.critd=150+(agg.critd||0);
 o.armorPct=agg.armor||0;o.evade=Math.min(45,st.dex*0.3+(agg.evade||0));
 o.leech=(agg.leech||0)+wg.leechB;o.gf=agg.gf||0;o.mf=agg.mf||0;o.xpB=agg.xp||0;o.spd=agg.spd||0;
 o.res=res;o.wg=wg;
 const w=h.eq.weapon;
 const wDmg=w&&w.baseDmg?w.baseDmg*(1+(w.enh||0)*0.18):2;
 const enh=w?1+(w.enh||0)*0.08:1;
 const physMul=(1+o.phys/100);
 o.dmgMin=Math.max(1,Math.round((wDmg*0.8+st.str*1.1+lvl*0.6)*enh*physMul*(1+o.dmgAll/100))||2);
 o.dmgMax=Math.max(o.dmgMin+1,Math.round((wDmg*1.2+st.str*1.5+lvl*0.9)*enh*physMul*(1+o.dmgAll/100))||3);
 o.spellPow=Math.max(1,Math.round((8+st.int*1.4+lvl*0.8)*(1+o.spell/100)*(1+o.dmgAll/100))||2);
 o.armor=Math.max(0,Math.round((st.vit*0.5+eqSum('armorFlat')+lvl*0.5)*(1+Math.max(-60,o.armorPct)/100)));
 o.maxhp=Math.max(10,Math.round((46+st.vit*9+lvl*7)*(1+o.hpPct/100)));
 o.maxmp=Math.max(5,Math.round(18+st.int*5+lvl*3+o.mpAdd));
 h.hp=Math.min(h.hp,o.maxhp);h.mp=Math.min(h.mp,o.maxmp);
 S.cs=o;return o;}
function addStat(k){if(!S||S.hero.sp<1)return;S.hero.sp--;S.hero.bonus[k]++;S.cs=null;calcStats();
 log('Характеристика повышена: <b>'+STATS[k]+'</b>','good');save();renderHero();renderTop();}
function respecStats(){const total=Object.values(S.hero.bonus).reduce((a,b)=>a+b,0);
 if(!total){toast('Очки не распределены');return;}
 const cost=50+S.hero.lvl*10;if(S.gold<cost){toast('Нужно '+fmt(cost)+' 🪙');return;}
 S.gold-=cost;S.hero.sp+=total;S.hero.bonus={str:0,dex:0,int:0,vit:0,luk:0};S.cs=null;calcStats();
 log('🌀 Наставник помогает переосмыслить себя. Возвращено очков: '+total,'sys');save();renderHero();renderTop();}
function xpNeed(l){return Math.round(38*Math.pow(l,1.65));}
function gainXP(n){const h=S.hero;const c=S.cs||calcStats();n=Math.round(n*(1+c.xpB/100));h.xp+=n;log('Получено опыта: <b>'+fmt(n)+'</b>','sys');
 while(h.xp>=xpNeed(h.lvl)){h.xp-=xpNeed(h.lvl);h.lvl++;h.pts+=1;h.sp+=3;const cs=calcStats();h.hp=cs.maxhp;h.mp=cs.maxmp;
  toast('⚜ УРОВЕНЬ '+h.lvl+'! +1 очко навыков, +3 очка характеристик');
  log('⚜ Достигнут <b>'+h.lvl+'</b> уровень! +1 очко навыков, +3 очка характеристик','good');}
 renderTop();save();}
function gainGold(n){const c=S.cs||calcStats();n=Math.round(n*(1+c.gf/100));S.gold+=n;return n;}

/* ================= ЛУТ ================= */
function rollAffix(lvl,mfB){const r=Math.random()*100*(1+(mfB||0)/100);let rar=0;
 if(r>96)rar=4;else if(r>86)rar=3;else if(r>66)rar=2;else if(r>38)rar=1;
 if(lvl>=10&&rar===0&&Math.random()<0.15)rar=1;return rar;}
function genItem(zoneLv,mf,forceRar,slots){
 let pool=BASES.filter(b=>b.lv<=zoneLv+2);
 if(slots&&slots.length)pool=pool.filter(b=>slots.includes(b.s));
 if(!pool.length)pool=BASES;
 const base=P(pool.slice(-8));
 const rar=forceRar!==undefined?forceRar:rollAffix(zoneLv,mf);
 const counts=[0,RI(1,2),RI(3,4),RI(5,6),RI(6,7)][rar];
 const used=new Set(),affNames=[];
 const pickFrom=(arr)=>{const cand=arr.filter(a=>!used.has(a.k));if(!cand.length)return;const a=P(cand);used.add(a.k);
  const v=Math.max(1,Math.round(R(a.v[0],a.v[1])*(0.7+zoneLv*0.06)));affNames.push({n:a.n,k:a.k,v:v});};
 for(let i=0;i<Math.ceil(counts/2);i++)pickFrom(PRE);
 const sufPool=base.s==='weapon'?SUF:SUF2;
 while(used.size<counts)pickFrom(Math.random()<0.5?PRE:sufPool);
 let nm=base.nm[RI(0,base.nm.length-1)];
 if(rar===1&&affNames[0])nm=affNames[0].n+' '+nm.charAt(0).toLowerCase()+nm.slice(1);
 if(rar===2)nm=nm+' «'+P(['Волка','Пепла','Луны','Крови','Бури','Пустоты','Зари','Врана','Шипа','Пламени'])+'»';
 if(rar>=3)nm=P(LEGN);
 const it={id:uid(),slot:base.s,nm:nm,icon:base.icon,rar:rar,lvl:Math.max(1,zoneLv+RI(-1,1)),enh:0,mods:{},gems:[],sockets:0};
 affNames.forEach(a=>{it.mods[a.k]=(it.mods[a.k]||0)+a.v;});
 if(base.dmg)it.baseDmg=RI(base.dmg[0],base.dmg[1]);else it.armorFlat=Math.round((base.arm||2)*(1+zoneLv*0.25));
 if(rar===4)it.sockets=2;else if(rar===3)it.sockets=RI(1,2);else if(rar===2&&Math.random()<0.5)it.sockets=1;
 return it;}
function makeUnique(u){return{id:uid(),slot:u.slot,nm:u.nm,icon:u.icon,rar:4,lvl:u.lvl,enh:0,unique:true,
 mods:Object.assign({},u.mods),sp:u.sp,spd:u.spd,gems:[],sockets:2,
 baseDmg:u.bd?RI(u.bd[0],u.bd[1]):undefined,armorFlat:u.arm||undefined};}
function makeZoneItem(zi){const d=P(ZONE_SET[zi]);
 return{id:uid(),slot:d.slot,nm:d.nm,icon:d.slot==='weapon'?'🗡️':'🛡',rar:3,lvl:d.lv,enh:0,set:true,
 mods:Object.assign({},d.mods),gems:[],sockets:1,spd:'Набор: '+ZONES[zi].nm,
 baseDmg:d.bd?RI(d.bd[0],d.bd[1]):undefined,armorFlat:d.arm||undefined};}
function sellPrice(it){return Math.round(((8+it.lvl*5)*(1+Object.keys(it.mods).length*0.55)*RMUL[it.rar]*0.5+(it.enh||0)*14)*(it.unique?2:1));}
function socketLine(it){let s='◈'.repeat(it.sockets||0);const g=(it.gems||[]).filter(Boolean).length;return it.sockets?('· гнёзда '+g+'/'+it.sockets):'';}
function itemHtml(it){
 const req=S.hero.lvl<it.lvl?' <span style="color:var(--blood)">(нужен ур. '+it.lvl+')</span>':'';
 const base=it.baseDmg?'⚔ Урон ~'+Math.round(it.baseDmg*(1+(it.enh||0)*0.18)):'🛡 Броня '+Math.round((it.armorFlat||0)*(1+(it.enh||0)*0.08));
 const en=it.enh?' <b class="c2">+'+it.enh+'</b>':'';
 const af=Object.keys(it.mods).map(k=>modStr(k,it.mods[k])).join(' · ');
 return '<div class="item r'+it.rar+'" onclick="itemMenu(\''+it.id+'\')">'
 +'<div style="font-size:22px">'+it.icon+'</div>'
 +'<div style="flex:1"><div class="nm '+RC[it.rar]+'">'+it.nm+en+req+'</div>'
 +'<div class="ds">'+(it.unique?'УНИКАЛЬНЫЙ':RAR[it.rar])+' · ур. '+it.lvl+' · '+(SLOTN[it.slot]||'предмет')+' · '+base+' '+socketLine(it)+'</div>'
 +(af?'<div class="af">✦ '+af+'</div>':'')
 +(it.spd?'<div class="spl">✧ '+it.spd+'</div>':'')+'</div>'
 +'<div class="eq">💰 '+fmt(sellPrice(it))+'</div></div>';}

function findItem(id){const i=S.hero.inv.findIndex(x=>x.id===id);if(i>=0)return{it:S.hero.inv[i],from:'inv',i:i};
 for(const s in S.hero.eq)if(S.hero.eq[s]&&S.hero.eq[s].id===id)return{it:S.hero.eq[s],from:'eq',s:s};return null;}
function itemMenu(id){const f=findItem(id);if(!f)return;const it=f.it;
 const eqBtn=f.from==='inv'?'<button class="btn" onclick="equipItem(\''+id+'\')">Надеть</button>':'<button class="btn" onclick="unequipItem(\''+it.slot+'\')">Снять</button>';

  for(let i=0;i<it.sockets;i++){const g=it.gems&&it.gems[i];
   if(g)sock+='<span class="gemchip" onclick="removeGem(\''+id+'\','+i+')" title="Вынуть">'+GEMS[g].icon+' '+GEMS[g].n+' ✕</span>';
   else{const opts=Object.keys(GEMS).filter(k=>(S.hero.gems[k]||0)>0);
    if(opts.length){sock+='<span style="display:inline-flex;gap:4px;align-items:center;margin:2px"><select class="gsel" id="gsel_'+i+'">'
     +opts.map(k=>'<option value="'+k+'">'+GEMS[k].icon+' '+GEMS[k].n+' ×'+S.hero.gems[k]+'</option>').join('')
     +'</select><button class="btn small" onclick="socketGem(\''+id+'\','+i+')">Вставить</button></span>';}
    else sock+='<span style="color:var(--dim2);font-size:12px;margin:2px;display:inline-block">пустое гнездо (самоцветов нет)</span>';}}
  sock+='<div style="font-size:11px;color:var(--dim2);margin-top:4px">Самоцвет в оружии даёт атакующий эффект, в броне — сопротивление.</div></div>';}
 $('main').innerHTML='<div class="panel"><h2 class="pt">'+it.icon+' '+it.nm+'</h2><div class="sub">'+(it.unique?'УНИКАЛЬНЫЙ':RAR[it.rar])+' · '+(SLOTN[it.slot]||'предмет')+' · уровень предмета '+it.lvl+(it.enh?' · заточка +'+it.enh:'')+'</div>'
 +(Object.keys(it.mods).map(k=>'<div class="statline"><span>✦ '+modStr(k,it.mods[k])+'</span></div>').join('')||'<div class="sub">Без особых свойств.</div>')
 +(it.spd?'<div class="statline"><span style="color:var(--gold2)">✧ '+it.spd+'</span></div>':'')
 +sock
 +'<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">'+eqBtn
 +' <button class="btn" onclick="show(\'forge\')">⚒ В кузницу</button>'
 +' <button class="btn danger" onclick="sellItem(\''+id+'\')">Продать ('+fmt(sellPrice(it))+' 🪙)</button>'
 +' <button class="btn" onclick="show(S.page)">Назад</button></div></div>';}
function socketGem(itId,idx){const sel=$('gsel_'+idx);const g=sel&&sel.value;
 if(!g||!(S.hero.gems[g]>0)){toast('Нет самоцветов');return;}
 const f=findItem(itId);if(!f)return;const it=f.it;
 if(!it.gems)it.gems=[];
 if(it.gems[idx])S.hero.gems[it.gems[idx]]++;
 it.gems[idx]=g;S.hero.gems[g]--;S.cs=null;
 log('💎 Самоцвет вставлен: '+GEMS[g].n+' → '+it.nm,'good');
 save();itemMenu(itId);renderTop();}
function removeGem(itId,idx){const f=findItem(itId);if(!f)return;const it=f.it;
 const g=it.gems&&it.gems[idx];if(!g)return;

function applyEnemyMods(d,sk){const e=COM.e;
 const defB=e.buffs.find(b=>b.k==='def');if(defB)d*=(1-defB.pct/100);
 if(e.trait&&e.trait.k==='stone'&&!sk.pierce)d*=0.65;

 if(e.debuff)d*=(1+e.debuff.pct/100);

 if(c.leech>0){const lh=Math.round((d+eb)*c.leech/100);if(lh>0){h.hp=Math.min(c.maxhp,h.hp+lh);}}

 if(sk.buff){const extra=(mast&&sk.m&&sk.m.buffT)?sk.m.buffT:0;
  sk.buff.forEach(b=>COM.pbuffs.push({k:b.k,pct:Math.round(b.pct*rMul),t:b.t+extra}));

  renderTop();return;}
 const e=COM.e;
 let mult=(sk.mult||1)*rMul;
 let base=sk.mag?Math.round(c.spellPow*mult):Math.round(R(c.dmgMin,c.dmgMax)*mult);

function drawTree(){if(!CT)buildClassTree();const svg=$('treesvg');if(!svg)return;const wrap=$('treewrap');const W=wrap.clientWidth,H=wrap.clientHeight;
 const col=CLASSES[S.hero.cls].col,ta=talloc();
 let out='<g id="tg" transform="translate('+VIEW.x+','+VIEW.y+') scale('+VIEW.k+')">';
 out+='<circle cx="0" cy="0" r="388" fill="none" stroke="#241b10" stroke-width="1" stroke-dasharray="4 8"/>';
 const seen=new Set();
 CT.nodes.forEach(n=>{(CT.adj[n.id]||[]).forEach(b=>{const key=[n.id,b].sort().join('-');if(seen.has(key))return;seen.add(key);
  const a=CT.byId[n.id],c2=CT.byId[b];if(!a||!c2)return;const on=ta[n.id]&&ta[b];
  out+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+c2.x+'" y2="'+c2.y+'" stroke="'+(on?col:'#332a1c')+'" stroke-width="'+(on?2.6:1.4)+'" opacity="'+(on?0.95:0.7)+'"/>';});});
 CT.nodes.forEach(n=>{
  const on=!!ta[n.id];const av=!on&&canAllocCT(n.id);
  const r=n.kind==='mastery'?13:n.kind==='origin'?9:8;
  const fill=on?col:'#141008';const stroke=on?col:av?col:'#4a3d28';
  const rankNum=n.kind==='rank'?n.id.split('_')[2]:'';
  out+='<g class="nd '+(av?'av':'')+'" data-id="'+n.id+'">'
  +'<circle class="halo" cx="'+n.x+'" cy="'+n.y+'" r="'+(r+7)+'" fill="none" stroke="'+col+'" stroke-width="1.5" opacity="0"/>'
  +'<circle class="core" cx="'+n.x+'" cy="'+n.y+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+(on?2.5:1.6)+'" '+(on?'style="filter:drop-shadow(0 0 5px '+col+')"':'')+'/>';
  if(n.kind==='mastery')out+='<circle cx="'+n.x+'" cy="'+n.y+'" r="'+(r+4)+'" fill="none" stroke="'+(on?col:'#5a4526')+'" stroke-width="1.2" stroke-dasharray="3 3"/><text x="'+n.x+'" y="'+(n.y+4)+'" text-anchor="middle" font-size="11" fill="'+(on?'#120d07':'#5a4526')+'" style="pointer-events:none">★</text>';
  if(n.kind==='rank')out+='<text x="'+n.x+'" y="'+(n.y+3.5)+'" text-anchor="middle" font-size="9" fill="'+(on?'#120d07':'#7a6a48')+'" style="pointer-events:none;font-weight:bold">'+rankNum+'</text>';
  out+='</g>';});
 out+='</g>';svg.innerHTML=out;
 if(!treeBuilt){VIEW={x:W/2,y:H/2,k:Math.max(0.45,Math.min(W,H)/950)};treeBuilt=true;}
 applyView();
 svg.onpointerdown=e=>{svg.setPointerCapture(e.pointerId);
  dragS={x:e.clientX,y:e.clientY,vx:VIEW.x,vy:VIEW.y,moved:0,el:(e.target&&e.target.closest)?e.target.closest('.nd'):null};
  svg.classList.add('grab');};
 svg.onpointermove=e=>{if(!dragS)return;const dx=e.clientX-dragS.x,dy=e.clientY-dragS.y;dragS.moved=Math.max(dragS.moved,Math.abs(dx)+Math.abs(dy));VIEW.x=dragS.vx+dx;VIEW.y=dragS.vy+dy;applyView();};
 svg.onpointerup=e=>{svg.classList.remove('grab');
  if(dragS&&dragS.moved<6){const el=dragS.el||((e.target&&e.target.closest)?e.target.closest('.nd'):null);if(el)allocNode(el.dataset.id);}
  dragS=null;};
 svg.onwheel=e=>{e.preventDefault();const rect=svg.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const f=e.deltaY>0?0.88:1.14;const k2=Math.max(0.3,Math.min(3,VIEW.k*f));
  VIEW.x=mx-(mx-VIEW.x)*(k2/VIEW.k);VIEW.y=my-(my-VIEW.y)*(k2/VIEW.k);VIEW.k=k2;applyView();};
 svg.querySelectorAll('.nd').forEach(g=>{g.addEventListener('mouseenter',e=>showTT(g.dataset.id,e));g.addEventListener('mouseleave',hideTT);});}
function applyView(){const g=$('tg');if(g)g.setAttribute('transform','translate('+VIEW.x+','+VIEW.y+') scale('+VIEW.k+')');}
function showTT(id,e){if(!CT)return;const nd=CT.byId[id];if(!nd)return;const tt=$('tt');const ta=talloc();

 tt.innerHTML=html;

 tt.style.left=Math.min(e.clientX-wr.left+14,wr.width-300)+'px';tt.style.top=Math.min(e.clientY-wr.top+10,wr.height-140)+'px';}

/* ================= FX ================= */
const cv=$('fx'),cx=cv.getContext('2d');const embers=[];
function fxResize(){cv.width=innerWidth;cv.height=innerHeight;}
addEventListener('resize',fxResize);fxResize();
for(let i=0;i<60;i++)embers.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,v:R(0.2,0.9),s:R(1,2.6),a:R(0.1,0.6),w:R(0,6.28)});
(function loop(){cx.clearRect(0,0,cv.width,cv.height);
 embers.forEach(p=>{p.y-=p.v;p.w+=0.02;p.x+=Math.sin(p.w)*0.3;if(p.y<-10){p.y=innerHeight+10;p.x=Math.random()*innerWidth;}
  cx.globalAlpha=p.a*(0.6+0.4*Math.sin(p.w*2));cx.fillStyle=Math.random()<0.1?'#f0cf8a':'#e0653a';
  cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.28);cx.fill();});
 cx.globalAlpha=1;requestAnimationFrame(loop);})();

/* ================= СТАРТ ================= */
function initGame(){
 try{
  const sv=localStorage.getItem('AS2');
  if(sv){
   S=JSON.parse(sv);
   S.ui=S.ui||{mapPage:0};S.log=S.log||[];
   S.hero.pots=S.hero.pots||{hp:0,mp:0};
   if(!S.hero.talloc)S.hero.talloc={origin:true,r_0_1:true};
   if(!S.hero.bonus)S.hero.bonus={str:0,dex:0,int:0,vit:0,luk:0};
   if(S.hero.sp===undefined)S.hero.sp=3*Math.max(0,S.hero.lvl-1);
   if(!S.hero.troph)S.hero.troph={};
   if(!S.hero.gems)S.hero.gems={};
   if(!S.hero.elix)S.hero.elix={rage:0,stone:0,swift:0};
   if(!S.board||!S.board.orders)S.board={orders:[genOrder(),genOrder(),genOrder()]};
   S.hero.prot=S.hero.prot||0;
   buildClassTree();S.cs=null;calcStats();
   if(!S.shopStock||!S.shopStock.length)S.shopStock=genShopStock();
   $('create').style.display='none';$('app').style.display='grid';
   log('Летопись продолжается.','sys');renderAll();
  } else renderCreate();
 }catch(e){showErr('init: '+e.message);console.error(e);renderCreate();}
}
initGame();
